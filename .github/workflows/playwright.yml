name: Playwright E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'

jobs:
  test:
    name: Run E2E Tests on ${{ matrix.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        
    permissions:
      contents: write

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Get Playwright Version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_ENV

      - name: 🧠 Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ matrix.browser }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Install Playwright Browsers & OS Dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install --with-deps ${{ matrix.browser }}
          else
            npx playwright install-deps ${{ matrix.browser }}
          fi

      - name: 🧪 Run Playwright Tests (Generate Blob)
        run: npx playwright test --project=${{ matrix.browser }} --reporter=blob
        env:
          SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
          SAUCE_GLITCH_USER: ${{ secrets.SAUCE_GLITCH_USER }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      - name: 📊 Upload Blob Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge Reports & Publish
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📥 Download all Blob Reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: 🔀 Merge Reports into HTML
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: 📊 Upload Consolidated HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-consolidated
          path: playwright-report/
          retention-days: 30

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          keep_files: true

         -name: 📧 Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Actions: Playwright Tests - ${{ needs.test.result }}"
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: "CI/CD Pipeline"
          body: |
            🛎️The E2E test execution finished with status: ${{ needs.test.result }}
            
            You can review the full consolidated Playwright report on GitHub Pages 🚀:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/