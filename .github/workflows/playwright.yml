name: Playwright E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
    - name: 🛎️ Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: 📦 Install Dependencies
      # npm ci es más rápido y estricto (ideal para CI) ya que usa el package-lock.json
      run: npm ci

    - name: 🌐 Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: 🧪 Run Playwright Tests
      run: npx playwright test
      env:
        # Inyección de secretos de GitHub como variables de entorno
        SAUCE_STANDARD_USER: ${{ secrets.SAUCE_STANDARD_USER }}
        SAUCE_GLITCH_USER: ${{ secrets.SAUCE_GLITCH_USER }}
        SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

    - name: 📊 Upload Playwright Report
      uses: actions/upload-artifact@v4
      # Asegura que el reporte se suba incluso si los tests fallan
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

